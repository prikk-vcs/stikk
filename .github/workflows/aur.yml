name: AUR

# RFC 051 decisions 4-6: stikk's two AUR packages, `stikk` (built from the crates.io crate) and
# `stikk-bin` (the release's static musl archives), built and linted from the templates in
# `packaging/aur/` and pushed only when the owner has set the key.
#
# **Three ways in.** On a push touching `packaging/aur/**` it renders the templates against the
# latest published release and **pushes nothing** — a template is never first exercised by a
# release (decision 5). `workflow_dispatch` is how the owner publishes the current release the
# day the secret is set, without waiting for the next tag (decision 6). `workflow_call` is how
# `release.yml` runs it after the assets and the crates are published.
#
# **Two jobs, and the gate is on the second** (review v1 C1). `packages` builds and lints on
# every change, unattended; `push` carries the `aur` environment and runs only when a caller
# asked for a push. It sends the artifact `packages` linted, byte for byte, and never re-renders
# — so what reaches the AUR is what was checked.
#
# **Key material never reaches a log, the workspace or an artifact.** The private half is read
# from the secret straight into an `ssh-agent` in the push step and nowhere else.
on:
  push:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to render (default: the latest published release)'
        required: false
        type: string
      push:
        description: 'Push to the AUR (needs AUR_SSH_PRIVATE_KEY)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      push:
        required: false
        default: false
        type: boolean
      # **For `release.yml` only** (RFC 051 decision 4): by the time the release calls this, the
      # release is public, the crates are on crates.io and the binaries are attached. A push the
      # AUR refused is a thing to fix, not a reason to redden a release that already happened. It
      # defaults to false, so a push to `packaging/aur/**` and a manual dispatch stay strict.
      tolerate_failure:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- build and lint, always
  #
  # **No `environment:` here, deliberately** (review v1 C1). A required reviewer on `aur` is the
  # owner's option (RFC 051 O2), and putting the gate on this job would make every lint run on a
  # push to `packaging/aur/**` wait for a click — quietly undoing decision 5's *"builds the
  # templates on every change"*, for a job that pushes nothing. The gate sits on `push` below,
  # which is the only job that touches anything outside this runner.
  packages:
    name: build and lint the AUR packages
    runs-on: ubuntu-latest
    # `makepkg`, `namcap` and `.SRCINFO` all need an Arch environment (RFC 051 F4).
    container: archlinux:base-devel
    env:
      # Where `makepkg` works — **outside the checkout**; see the builder step for why.
      AUR_WORK: /tmp/aur
    outputs:
      version: ${{ steps.v.outputs.version }}
      built: ${{ steps.build.outcome }}
    steps:
      - name: Install what makepkg and namcap need
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed cargo namcap git jq

      - uses: actions/checkout@v5

      - name: Which release to render
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${ASKED}" ]; then
            version="${ASKED}"
          else
            # The latest published release, the same thing `installers.yml` renders against.
            version="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | jq -r .tag_name)"
          fi
          [ -n "${version}" ] && [ "${version}" != "null" ] \
            || { echo "::error::no version to render"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "rendering stikk ${version}"

      # **`makepkg` refuses to run as root**, and this container is root.
      - name: A builder user who owns the work
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # **Built outside the checkout, on purpose** (first CI run): `stikk`'s PKGBUILD extracts
          # the crate into `src/stikk-<ver>/`, and anywhere under this repository that is a
          # directory with its own `Cargo.toml` inside stikk's workspace -- so `cargo fetch`
          # refuses with *"current package believes it's in a workspace when it's not"* before
          # `prepare()` finishes. `/tmp` is outside it, and is where this was measured locally.
          install -d -o builder -g builder "$AUR_WORK"
          # `makepkg` installs no dependency here (see `-d` below), so it needs no sudo at all.

      - name: Render both PKGBUILDs
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          su builder -c "cd '$GITHUB_WORKSPACE' && ./packaging/aur/render.sh '${VERSION}' '$AUR_WORK'"
          echo '== stikk'; cat "$AUR_WORK/stikk/PKGBUILD"
          echo '== stikk-bin'; cat "$AUR_WORK/stikk-bin/PKGBUILD"

      - name: Build, lint and describe each package
        id: build
        continue-on-error: ${{ inputs.tolerate_failure == true }}
        run: |
          set -euo pipefail
          # **`-d` skips only the *dependency check*, not the build.** prikk is not in the official
          # Arch repositories and its own AUR package is still a placeholder, so `prikk>=0.28`
          # cannot be installed in this container; `makepkg` would refuse before building anything.
          # It does not weaken what is proven here: the sources are fetched and checksummed, the
          # crate is compiled, its tests run, and the package is assembled and linted.
          #
          # **Every namcap line must be on the allow-list below.** A warning nobody has looked at
          # is a warning nobody will look at, so an unexpected one fails the job.
          allowed() {
            case "$1" in
              # The per-architecture source array *requires* the literal architecture in its name;
              # `source_$CARCH` is not a thing namcap can see through.
              *"Reference to x86_64 should be changed to \$CARCH"*) return 0 ;;
              # Deliberate, and the point of the package: stripping would rewrite the binary and
              # `gh attestation verify` on the release archive would stop speaking for it.
              *"ELF file ('usr/bin/stikk') is unstripped."*) return 0 ;;
              # stikk *runs* prikk as a program; namcap only sees linked libraries, so it cannot
              # see the dependency it is questioning.
              *"Dependency included, but may not be needed ('prikk')"*) return 0 ;;
              # The dynamic loader itself, named by every dynamically linked binary and imported
              # from by none. Seen on the maintainer's Arch-based machine; it may not appear here,
              # and if this first run does not show it, the entry goes (review v1).
              *"Unused shared library '/usr/lib64/ld-linux-x86-64.so.2'"*) return 0 ;;
              *) return 1 ;;
            esac
          }
          fail=0
          # The two files per package the AUR receives, collected inside the workspace for the
          # artifact. Only these: no `Cargo.toml` comes back in, so the workspace stays sound.
          mkdir -p "$GITHUB_WORKSPACE/aur-dist"
          for pkg in stikk-bin stikk; do
            echo "::group::${pkg}"
            su builder -c "cd '$AUR_WORK/${pkg}' && makepkg -f -d"
            : > "/tmp/${pkg}.namcap"
            su builder -c "cd '$AUR_WORK/${pkg}' && namcap PKGBUILD" \
              >> "/tmp/${pkg}.namcap"
            su builder -c "cd '$AUR_WORK/${pkg}' && namcap ./*.pkg.tar.*" \
              >> "/tmp/${pkg}.namcap"
            cat "/tmp/${pkg}.namcap"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              if ! allowed "$line"; then
                echo "::error::${pkg}: namcap line not on the allow-list: ${line}"
                fail=1
              fi
            done < "/tmp/${pkg}.namcap"
            # The AUR needs this beside the PKGBUILD, and it is generated, never written.
            mkdir -p "$GITHUB_WORKSPACE/aur-dist/${pkg}"
            cp "$AUR_WORK/${pkg}/PKGBUILD" "$GITHUB_WORKSPACE/aur-dist/${pkg}/PKGBUILD"
            su builder -c "cd '$AUR_WORK/${pkg}' && makepkg --printsrcinfo" \
              > "$GITHUB_WORKSPACE/aur-dist/${pkg}/.SRCINFO"
            echo "== ${pkg} .SRCINFO"; cat "$GITHUB_WORKSPACE/aur-dist/${pkg}/.SRCINFO"
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ] || exit 1

      # **Exactly the two files per package that the AUR receives**, and nothing else: not the
      # built package, not the sources, not the work tree. `push` sends these bytes as they are
      # and never re-renders, so what goes to the AUR is what was linted here.
      #
      # `include-hidden-files` is not optional: `.SRCINFO` begins with a dot, and without it the
      # upload would quietly drop half of what the push needs.
      - name: Keep what the push will send
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aur-packages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            aur-dist/stikk/PKGBUILD
            aur-dist/stikk/.SRCINFO
            aur-dist/stikk-bin/PKGBUILD
            aur-dist/stikk-bin/.SRCINFO

      # **A tolerated failure is still said out loud**, naming this job. Without it a release run
      # would be green with the reason buried in a collapsed step.
      - name: Say so if the build was tolerated
        if: always()
        run: |
          set -euo pipefail
          outcome='${{ steps.build.outcome }}'
          if [ "$outcome" != 'success' ]; then
            echo "::error::AUR / packages: the packages did not build or lint (${outcome}), so nothing was pushed. The release itself is unaffected; re-run this workflow alone from Actions -> AUR -> Run workflow, with the tag as 'version' and 'push' checked."
          else
            echo "packages: ${outcome}"
          fi

  # ---------------------------------------------------------------- push, only when asked
  #
  # **The only job that writes anything outside this runner**, and so the only one that carries
  # the `aur` environment (review v1 C1). It is skipped entirely unless the caller asked for a
  # push, so a lint run never waits on a reviewer.
  #
  # **Where the owner should store the key**: in this **environment**, not at repository level.
  # The AUR scopes keys to the account, not the package (RFC 051 F4), so this one key can push
  # prikk's two packages as well as stikk's — an environment secret reaches only this job, and
  # adding a required reviewer to `aur` then gates every use of it. A repository secret works
  # too, through `secrets: inherit`, but it is readable by every workflow in the repository.
  push:
    name: push to the AUR
    needs: packages
    if: ${{ inputs.push && needs.packages.outputs.built == 'success' }}
    runs-on: ubuntu-latest
    environment: aur
    permissions:
      contents: read
    steps:
      # For `packaging/aur/known_hosts` and nothing else.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: aur-packages
          path: aur-dist

      - name: What the push is about to send
        run: |
          set -euo pipefail
          for pkg in stikk stikk-bin; do
            for f in PKGBUILD .SRCINFO; do
              [ -s "aur-dist/${pkg}/${f}" ] || { echo "::error::aur-dist/${pkg}/${f} is missing or empty"; exit 1; }
            done
          done
          sha256sum aur-dist/*/PKGBUILD aur-dist/*/.SRCINFO

      - name: Push to the AUR
        id: push
        continue-on-error: ${{ inputs.tolerate_failure == true }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "::notice::not pushing: the AUR_SSH_PRIVATE_KEY secret is not set"
            exit 0
          fi
          # **The key lives in the agent and nowhere else** — never a file in the workspace, never
          # an artifact, never echoed. `ssh-add -` reads it from stdin.
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" | ssh-add - >/dev/null 2>&1 \
            || { echo "::error::the AUR key was not accepted by ssh-agent"; exit 1; }
          # **Pinned host keys, and nothing else** (RFC 051 decision 4): `yes`, with our own file,
          # so an unknown key is a refusal rather than trust-on-first-use.
          export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/packaging/aur/known_hosts"
          git config --global user.name 'stikk release'
          git config --global user.email 'noreply@github.com'
          for pkg in stikk stikk-bin; do
            echo "::group::push ${pkg}"
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "/tmp/aur-${pkg}"
            cp "aur-dist/${pkg}/PKGBUILD" "aur-dist/${pkg}/.SRCINFO" "/tmp/aur-${pkg}/"
            cd "/tmp/aur-${pkg}"
            git add PKGBUILD .SRCINFO
            # **A re-run is a no-op**: nothing to commit means nothing to push.
            if git diff --cached --quiet; then
              echo "::notice::${pkg} is already at ${VERSION} on the AUR — nothing to push"
            else
              git commit -m "stikk ${VERSION}"
              git push origin HEAD:master
            fi
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done

      - name: Say so if the push was tolerated
        if: always()
        run: |
          set -euo pipefail
          outcome='${{ steps.push.outcome }}'
          if [ "$outcome" != 'success' ]; then
            echo "::error::AUR / push: the push did not complete (${outcome}). The release itself is unaffected; re-run this workflow alone from Actions -> AUR -> Run workflow, with the tag as 'version' and 'push' checked."
          else
            echo "push: ${outcome}"
          fi
