name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: fmt · clippy · test · rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Rustdoc
        # RFC 011 §4 (0.4.0 release prep): deferred by RFC 012 "with 0.4.0 planning" and grown from 19
        # warnings to 23 while nothing gated it. A docs-publishing failure (docs.yml) is a broken site;
        # a CI failure here is a caught regression before it ships — which is what this is for.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --locked
