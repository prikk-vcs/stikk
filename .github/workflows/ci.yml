name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: fmt · clippy · test · rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the MSRV from Cargo.toml, never restate it
        # RFC 020 §4: the number appeared in five places at once and three of them went stale the day
        # it moved. One source (`Cargo.toml`'s `rust-version`), read here — the same discipline
        # `validated_ceiling_display()` holds for the prikk ceiling and RFC 019's `print_version_matrix`
        # holds for the version matrix.
        id: msrv
        run: echo "v=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (derived MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Rustdoc
        # RFC 011 §4 (0.4.0 release prep): deferred by RFC 012 "with 0.4.0 planning" and grown from 19
        # warnings to 23 while nothing gated it. A docs-publishing failure (docs.yml) is a broken site;
        # a CI failure here is a caught regression before it ships — which is what this is for.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --locked
