name: Installers

# RFC 039 decision 3: the installer scripts are tested by installing a real release with the
# scripts from the commit under test, on all three platforms. Until the first release that carries
# them, that is the **latest published** release; from then on it is the one they ship with.
#
# Not on every push: these legs download from GitHub releases, and an upstream hiccup must not
# redden a PR for a reason stikk did not cause. They run when the scripts themselves change.
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    name: derive the versions under test
    runs-on: ubuntu-latest
    outputs:
      stikk: ${{ steps.v.outputs.stikk }}
      prikk: ${{ steps.v.outputs.prikk }}
      inrange: ${{ steps.v.outputs.inrange }}
      floor: ${{ steps.v.outputs.floor }}
      below: ${{ steps.v.outputs.below }}
      above: ${{ steps.v.outputs.above }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: The latest published stikk, and the prikk range version.rs validates
        id: v
        # All derived, never written here: the range comes from `version.rs` the way the
        # real-binary suite's matrix does, so changing it re-words the installers too.
        # **Neither end is a pin** since RFC 048 -- the installers install no prikk; the floor
        # and ceiling word the version report, and `below`/`above` are the two fake versions the
        # out-of-range legs put on PATH.
        #
        # **`prikk` and `inrange` are two values now** (RFC 052 decision 4). `prikk` is what the
        # scripts print -- a **minor**, `0.<ceiling>`, filled exactly as `release.yml` fills it,
        # because `VALIDATED_MAX_MINOR` bands on minors and `0.<n>.0` named a patch stikk never
        # tested. `inrange` is what the in-range leg puts on PATH, and that has to stay a full
        # `0.<n>.0`: the scripts read a version with `(\d+)\.(\d+)\.(\d+)`, so a fake prikk
        # answering *prikk 0.54* would take the **unreadable** row and the leg would assert the
        # in-range sentence against the wrong one.
        run: |
          set -euo pipefail
          stikk="$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)"
          read -r floor ceiling < <(cargo run --quiet -p stikk-prikk --example print_version_matrix)
          echo "stikk=${stikk}"              >> "$GITHUB_OUTPUT"
          echo "prikk=0.${ceiling}"          >> "$GITHUB_OUTPUT"
          echo "inrange=0.${ceiling}.0"      >> "$GITHUB_OUTPUT"
          echo "floor=${floor}"              >> "$GITHUB_OUTPUT"
          echo "below=0.$((floor - 1)).0"    >> "$GITHUB_OUTPUT"
          echo "above=0.$((ceiling + 1)).0"  >> "$GITHUB_OUTPUT"
          echo "testing the installers against stikk ${stikk}, prikk 0.${floor} through 0.${ceiling}"
        env:
          GH_TOKEN: ${{ github.token }}

  unix:
    name: install.sh (${{ matrix.os }})
    needs: derive
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      STIKK_VER: ${{ needs.derive.outputs.stikk }}
      PRIKK_VER: ${{ needs.derive.outputs.prikk }}
      PRIKK_INRANGE: ${{ needs.derive.outputs.inrange }}
      PRIKK_FLOOR: ${{ needs.derive.outputs.floor }}
      PRIKK_BELOW: ${{ needs.derive.outputs.below }}
      PRIKK_ABOVE: ${{ needs.derive.outputs.above }}
    steps:
      - uses: actions/checkout@v5

      - name: Fill the placeholders the way release.yml does
        run: |
          set -euo pipefail
          mkdir -p filled
          for f in install.sh uninstall.sh; do
            sed -e "s/@STIKK_VERSION@/${STIKK_VER}/g" \
                -e "s/@PRIKK_FLOOR@/${PRIKK_FLOOR}/g" \
                -e "s/@PRIKK_VERSION@/${PRIKK_VER}/g" \
              "scripts/$f" > "filled/$f"
            chmod +x "filled/$f"
          done
          ! grep -q '@STIKK_VERSION@\|@PRIKK_FLOOR@\|@PRIKK_VERSION@' filled/* \
            || { echo "::error::placeholder survived"; exit 1; }

      - name: The unfilled template refuses to run
        run: |
          set -euo pipefail
          if sh scripts/install.sh --prefix "$RUNNER_TEMP/never"; then
            echo "::error::the template installed something; it must refuse"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/never/stikk"

      - name: Install, and check the version
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          printf '# test shell config\n' > "$HOME/.zshrc"
          cp "$HOME/.zshrc" "$RUNNER_TEMP/zshrc.before"
          sh filled/install.sh --prefix "$RUNNER_TEMP/bin" | tee "$RUNNER_TEMP/install.log"
          "$RUNNER_TEMP/bin/stikk" --version
          "$RUNNER_TEMP/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"
          # On x86_64 Linux it must take the **static musl** build, not the glibc one: the glibc
          # build cannot start on Alpine or against an older glibc (review v1 §2.2).
          if [ "$RUNNER_OS" = Linux ] && [ "$(uname -m)" = x86_64 ]; then
            grep -q 'x86_64-unknown-linux-musl' "$RUNNER_TEMP/install.log"
            file "$RUNNER_TEMP/bin/stikk" | grep -q 'static-pie'
          fi

      - name: Re-running is safe
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          sh filled/install.sh --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"

      - name: The uninstaller leaves things as it found them
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          sh filled/uninstall.sh --prefix "$RUNNER_TEMP/bin"
          test ! -e "$RUNNER_TEMP/bin/stikk"
          # Byte-identical, including the blank line the installer writes before its PATH block.
          diff "$HOME/.zshrc" "$RUNNER_TEMP/zshrc.before"

      - name: A wrong checksum installs nothing
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mirror="$RUNNER_TEMP/mirror"; mkdir -p "$mirror"
          # **The same target `install.sh` picks**, or the mirror will not hold the file it asks
          # for and this step fails on a fetch error instead of a checksum mismatch -- which is
          # what happened the first time the assertion below was in place, because Linux x86_64
          # moved to the musl build.
          case "$RUNNER_OS/$(uname -m)" in
            Linux/x86_64)          target=x86_64-unknown-linux-musl ;;
            Linux/aarch64|Linux/arm64) target=aarch64-unknown-linux-musl ;;
            macOS/arm64)           target=aarch64-apple-darwin ;;
            macOS/x86_64)          target=x86_64-apple-darwin ;;
            *) echo "::error::unhandled runner $RUNNER_OS/$(uname -m)"; exit 1 ;;
          esac
          echo "mirroring $target, the build install.sh picks here"
          archive="stikk-${STIKK_VER}-${target}.tar.gz"
          base="https://github.com/${{ github.repository }}/releases/download/${STIKK_VER}"
          curl -fsSL -o "$mirror/$archive"        "$base/$archive"
          curl -fsSL -o "$mirror/$archive.sha256" "$base/$archive.sha256"
          # The real checksum, a tampered archive.
          printf 'this is not the real archive' > "$mirror/$archive"
          if sh filled/install.sh --prefix "$RUNNER_TEMP/tampered" \
               --base-url "file://$mirror" > "$RUNNER_TEMP/tamper.log" 2>&1; then
            echo "::error::the installer accepted a file that failed its checksum"
            exit 1
          fi
          cat "$RUNNER_TEMP/tamper.log"
          # **Why it failed, not just that it did.** A fetch error would also exit non-zero and
          # would leave this test green while testing nothing.
          grep -q 'does NOT match the published checksum' "$RUNNER_TEMP/tamper.log"
          test ! -e "$RUNNER_TEMP/tampered/stikk"

      # ---------------------------------------------------------------- RFC 048: no prikk, ever
      #
      # The four rows of the version report, and the proof that the first of them costs prikk
      # nothing: each program installs itself, so these legs are as much about what the script
      # does *not* do as about what it prints.

      - name: prikk missing — stikk installs, prikk's command is printed, and nothing of prikk's is fetched
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/no-prikk"; mkdir -p "$home"
          # **Prove the premise before testing on it.** A `prikk` left on PATH by another leg
          # would make this pass while testing the wrong row.
          ! command -v prikk >/dev/null 2>&1 || { echo "::error::prikk is on PATH; this leg tests the missing case"; exit 1; }
          # **Every URL the script fetches, recorded.** The assertion below is not "no prikk was
          # installed" -- that would pass if the script downloaded prikk's installer and the run
          # failed. It is that prikk's assets were never asked for at all.
          wrap="$RUNNER_TEMP/wrap"; mkdir -p "$wrap"
          real_curl="$(command -v curl)"
          cat > "$wrap/curl" <<WRAP
          #!/bin/sh
          for a in "\$@"; do case "\$a" in http*|file*) echo "\$a" >> "$RUNNER_TEMP/urls.txt" ;; esac; done
          exec "$real_curl" "\$@"
          WRAP
          chmod +x "$wrap/curl"
          : > "$RUNNER_TEMP/urls.txt"
          HOME="$home" PATH="$wrap:$PATH" sh filled/install.sh --prefix "$home/bin" \
            | tee "$RUNNER_TEMP/missing.log"
          # Exit 0: stikk is installed, and a missing prikk is reported, not an error.
          "$home/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"
          grep -qF 'stikk reads prikk repositories, so you need prikk too.' "$RUNNER_TEMP/missing.log"
          grep -qF 'prikk installs itself. Run this:' "$RUNNER_TEMP/missing.log"
          # **prikk's command, exactly as prikk publishes it.**
          grep -qF 'curl -fsSL https://github.com/prikk-vcs/prikk/releases/latest/download/install.sh | sh' \
            "$RUNNER_TEMP/missing.log"
          grep -qF '1. install prikk (the command is above)' "$RUNNER_TEMP/missing.log"
          # Nothing of prikk's was written …
          ! find "$home" "$HOME/.local/bin" -name 'prikk*' 2>/dev/null | grep -q . \
            || { echo "::error::something of prikk's was written"; exit 1; }
          # … and nothing of prikk's was even requested.
          echo "URLs fetched:"; cat "$RUNNER_TEMP/urls.txt"
          ! grep -q 'prikk-vcs/prikk' "$RUNNER_TEMP/urls.txt" \
            || { echo "::error::the installer asked for one of prikk's assets"; exit 1; }

      - name: The version report — too old, inside the range, newer than tested
        run: |
          set -euo pipefail
          fake() {
            d="$RUNNER_TEMP/fake-$1"; mkdir -p "$d"
            printf '#!/bin/sh\necho "prikk %s"\n' "$1" > "$d/prikk"
            chmod +x "$d/prikk"
            echo "$d"
          }
          run_with() {
            home="$RUNNER_TEMP/h-$1"; mkdir -p "$home"
            HOME="$home" PATH="$(fake "$1"):$PATH" sh filled/install.sh --prefix "$home/bin" \
              | tee "$RUNNER_TEMP/report-$1.log"
            "$home/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"
          }

          # **Too old: one of the three rows that must not say "still runs".**
          run_with "${PRIKK_BELOW}"
          grep -qF "that is too old for this stikk, which needs prikk 0.${PRIKK_FLOOR} or newer." \
            "$RUNNER_TEMP/report-${PRIKK_BELOW}.log"
          grep -qF 'curl -fsSL https://github.com/prikk-vcs/prikk/releases/latest/download/install.sh | sh' \
            "$RUNNER_TEMP/report-${PRIKK_BELOW}.log"
          grep -qF '1. install or update prikk' "$RUNNER_TEMP/report-${PRIKK_BELOW}.log"
          ! grep -qi 'still runs' "$RUNNER_TEMP/report-${PRIKK_BELOW}.log" \
            || { echo "::error::it told someone an out-of-range prikk still runs"; exit 1; }

          # **Another major is not "too old"** (review v1 C3): stikk supports major 0 only, so
          # the answer is a newer stikk, not a newer prikk.
          run_with "1.0.0"
          grep -qF 'this stikk was built for prikk 0.x and does not know prikk 1.x' \
            "$RUNNER_TEMP/report-1.0.0.log"
          grep -qF 'https://github.com/prikk-vcs/stikk/releases/latest' "$RUNNER_TEMP/report-1.0.0.log"
          grep -qF '1. check for a newer stikk' "$RUNNER_TEMP/report-1.0.0.log"
          # **Never prikk's installer here**: it would leave the reader on the prikk they have.
          ! grep -qF 'releases/latest/download/install.sh' "$RUNNER_TEMP/report-1.0.0.log" \
            || { echo "::error::it told a prikk-1.x user to reinstall prikk"; exit 1; }
          ! grep -qi 'too old' "$RUNNER_TEMP/report-1.0.0.log" \
            || { echo "::error::a newer major was called too old"; exit 1; }

          # **A version stikk cannot read**: measured, stikk refuses to start, so the installer
          # must say that and not the reassuring sentence the in-range rows use (review v1 C2).
          unreadable="$RUNNER_TEMP/fake-unreadable"; mkdir -p "$unreadable"
          printf '#!/bin/sh\necho "prikk version unknown"\n' > "$unreadable/prikk"
          chmod +x "$unreadable/prikk"
          home="$RUNNER_TEMP/h-unreadable"; mkdir -p "$home"
          HOME="$home" PATH="$unreadable:$PATH" sh filled/install.sh --prefix "$home/bin" \
            | tee "$RUNNER_TEMP/report-unreadable.log"
          "$home/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"
          grep -qF 'will refuse to start with this prikk' "$RUNNER_TEMP/report-unreadable.log"
          grep -qF '1. install or update prikk' "$RUNNER_TEMP/report-unreadable.log"
          ! grep -qi 'still runs' "$RUNNER_TEMP/report-unreadable.log" \
            || { echo "::error::it promised an unreadable prikk still runs"; exit 1; }

          # **Inside the range.** The fake prikk answers a full `0.<n>.0` (`PRIKK_INRANGE`),
          # because the script parses three numbers; the sentence it prints names the **minor**
          # the scripts were filled with (`PRIKK_VER`). Two values, one row.
          run_with "${PRIKK_INRANGE}"
          grep -qF "that is inside the range this stikk was tested against (0.${PRIKK_FLOOR} through ${PRIKK_VER})" \
            "$RUNNER_TEMP/report-${PRIKK_INRANGE}.log"

          # **Newer than tested: calm, and it still runs.** This is the normal state for a few
          # days after every prikk release.
          run_with "${PRIKK_ABOVE}"
          grep -qF "that is newer than this stikk was tested against (0.${PRIKK_FLOOR} through ${PRIKK_VER})." \
            "$RUNNER_TEMP/report-${PRIKK_ABOVE}.log"
          grep -qF 'It still runs' "$RUNNER_TEMP/report-${PRIKK_ABOVE}.log"

      - name: The removed flags fail loudly
        run: |
          set -euo pipefail
          # A stale copy-pasted command must not appear to work.
          for flag in --with-prikk --no-prikk; do
            if sh filled/install.sh --prefix "$RUNNER_TEMP/flagged" "$flag" > "$RUNNER_TEMP/flag.log" 2>&1; then
              echo "::error::$flag was accepted"; exit 1
            fi
            cat "$RUNNER_TEMP/flag.log"
            grep -qF "unknown option: $flag" "$RUNNER_TEMP/flag.log"
            test ! -e "$RUNNER_TEMP/flagged/stikk"
          done

  windows:
    name: install.ps1 (windows-latest)
    needs: derive
    runs-on: windows-latest
    env:
      STIKK_VER: ${{ needs.derive.outputs.stikk }}
      PRIKK_VER: ${{ needs.derive.outputs.prikk }}
      PRIKK_INRANGE: ${{ needs.derive.outputs.inrange }}
      PRIKK_FLOOR: ${{ needs.derive.outputs.floor }}
      PRIKK_BELOW: ${{ needs.derive.outputs.below }}
      PRIKK_ABOVE: ${{ needs.derive.outputs.above }}
    steps:
      - uses: actions/checkout@v5

      - name: Fill the placeholders the way release.yml does
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p filled
          for f in install.ps1 uninstall.ps1; do
            sed -e "s/@STIKK_VERSION@/${STIKK_VER}/g" \
                -e "s/@PRIKK_FLOOR@/${PRIKK_FLOOR}/g" \
                -e "s/@PRIKK_VERSION@/${PRIKK_VER}/g" \
              "scripts/$f" > "filled/$f"
          done
          ! grep -q '@STIKK_VERSION@\|@PRIKK_FLOOR@\|@PRIKK_VERSION@' filled/* \
            || { echo "::error::placeholder survived"; exit 1; }

      # Run it as its own process: the script refuses by calling `exit 1`, and invoked inline that
      # ends the step itself before anything can be checked (its first run failed exactly so,
      # having printed the correct refusal first).
      - name: The unfilled template refuses to run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & (Get-Process -Id $PID).Path -NoProfile -File ./scripts/install.ps1 -Prefix "$env:RUNNER_TEMP\never"
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error 'the template installed something; it must refuse'; exit 1 }
          Write-Host "refused with exit $code, as it should"
          if (Test-Path "$env:RUNNER_TEMP\never\stikk.exe") { Write-Error 'it installed anyway'; exit 1 }
          # GitHub's pwsh shell ends every step with `exit $LASTEXITCODE`, which is still the
          # child's 1 -- so a step that *expects* a failure has to say it succeeded.
          exit 0

      - name: Install, and check the version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./filled/install.ps1 -Prefix "$env:RUNNER_TEMP\bin"
          $v = & "$env:RUNNER_TEMP\bin\stikk.exe" --version
          if ($v.Trim() -ne "stikk $env:STIKK_VER") { Write-Error "got '$v'"; exit 1 }

      - name: Re-running is safe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./filled/install.ps1 -Prefix "$env:RUNNER_TEMP\bin"
          $v = & "$env:RUNNER_TEMP\bin\stikk.exe" --version
          if ($v.Trim() -ne "stikk $env:STIKK_VER") { Write-Error "got '$v'"; exit 1 }

      - name: The uninstaller removes what it added, and prints prikk's own uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./filled/uninstall.ps1 -Prefix "$env:RUNNER_TEMP\bin" *>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\uninstall.log"
          if (Test-Path "$env:RUNNER_TEMP\bin\stikk.exe") { Write-Error 'stikk.exe survived'; exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and ($userPath -split ';' | Where-Object { $_ -and ($_.TrimEnd('\') -ieq "$env:RUNNER_TEMP\bin") })) {
            Write-Error 'the PATH entry survived'; exit 1
          }
          # **prikk is removed by prikk's own uninstaller** (RFC 048 decision 2, RFC 052
          # decision 2): this script says so and prints prikk's command, and removes nothing of
          # prikk's itself.
          $log = Get-Content "$env:RUNNER_TEMP\uninstall.log" -Raw
          if ($log -notmatch [regex]::Escape('prikk was NOT removed -- it is a separate program, and prikk uninstalls itself:')) {
            Write-Error 'it did not say prikk was left alone'; exit 1
          }
          if ($log -notmatch [regex]::Escape('irm https://github.com/prikk-vcs/prikk/releases/latest/download/uninstall.ps1 | iex')) {
            Write-Error "prikk's uninstall command was not printed"; exit 1
          }

      - name: A wrong checksum installs nothing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $mirror = "$env:RUNNER_TEMP\mirror"
          New-Item -ItemType Directory -Path $mirror -Force | Out-Null
          $archive = "stikk-$env:STIKK_VER-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:STIKK_VER"
          Invoke-WebRequest -Uri "$base/$archive"        -OutFile "$mirror\$archive"        -UseBasicParsing
          Invoke-WebRequest -Uri "$base/$archive.sha256" -OutFile "$mirror\$archive.sha256" -UseBasicParsing
          # The real checksum, a tampered archive.
          Set-Content -Path "$mirror\$archive" -Value 'this is not the real archive' -NoNewline
          $uri = ([System.Uri]("file:///" + $mirror.Replace('\','/'))).AbsoluteUri
          # Its own process, for the same reason the template check uses one: the script refuses
          # with `exit 1`, and inline that would end this step before anything is asserted.
          & (Get-Process -Id $PID).Path -NoProfile -File ./filled/install.ps1 -Prefix "$env:RUNNER_TEMP\tampered" -BaseUrl $uri 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\tamper.log"
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error 'the installer accepted a file that failed its checksum'; exit 1 }
          Write-Host "refused with exit $code, as it should"
          # **Why it failed, not just that it did**: a malformed mirror URI would also exit
          # non-zero and leave this test green while testing nothing.
          if (-not (Select-String -Path "$env:RUNNER_TEMP\tamper.log" -SimpleMatch 'does NOT match the published checksum' -Quiet)) {
            Write-Error 'it failed, but not because of the checksum'; exit 1
          }
          if (Test-Path "$env:RUNNER_TEMP\tampered\stikk.exe") { Write-Error 'it installed anyway'; exit 1 }
          exit 0

      # ---------------------------------------------------------------- RFC 048: no prikk, ever

      - name: prikk missing — stikk installs, prikk's guide is printed, and nothing of prikk's is fetched
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # **Prove the premise before testing on it.**
          if (Get-Command prikk -ErrorAction SilentlyContinue) {
            Write-Error 'prikk is on PATH; this leg tests the missing case'; exit 1
          }
          $prefix = "$env:RUNNER_TEMP\noprikk"
          & ./filled/install.ps1 -Prefix $prefix *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\missing.log"
          $log = Get-Content "$env:RUNNER_TEMP\missing.log" -Raw
          if ($log -notmatch 'stikk reads prikk repositories, so you need prikk too\.') {
            Write-Error 'it did not say prikk is needed'; exit 1
          }
          if ($log -notmatch 'prikk installs itself\. Run this:') { Write-Error 'it did not say prikk installs itself'; exit 1 }
          # **prikk's command, exactly as prikk publishes it** (RFC 052 decision 2), and prikk's
          # guide beside it -- the same pair the Unix leg asserts.
          if ($log -notmatch [regex]::Escape('irm https://github.com/prikk-vcs/prikk/releases/latest/download/install.ps1 | iex')) {
            Write-Error "prikk's install command was not printed"; exit 1
          }
          if ($log -notmatch [regex]::Escape("prikk's install guide: https://prikk.org/docs/guide/install.html")) {
            Write-Error "prikk's guide was not printed"; exit 1
          }
          if ($log -notmatch '1\. install prikk \(the command is above\)') { Write-Error 'the Next list did not lead with prikk'; exit 1 }
          $v = & "$prefix\stikk.exe" --version
          if ($v.Trim() -ne "stikk $env:STIKK_VER") { Write-Error "got '$v'"; exit 1 }
          # **Nothing of prikk's was written.** Windows has no curl wrapper here; what it can
          # prove is that no prikk arrived, and the script's own text is checked above.
          if (Get-ChildItem -Path $prefix -Filter 'prikk*' -Recurse -ErrorAction SilentlyContinue) {
            Write-Error "something of prikk's was written"; exit 1
          }

      - name: The version report — too old, inside the range, newer than tested
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-WithFakePrikk {
            param([string] $PrikkVersion)
            $dir = "$env:RUNNER_TEMP\fake-$PrikkVersion"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Set-Content -Path "$dir\prikk.cmd" -Value "@echo prikk $PrikkVersion"
            $saved = $env:Path
            try {
              $env:Path = "$dir;$env:Path"
              $prefix = "$env:RUNNER_TEMP\r-$PrikkVersion"
              & ./filled/install.ps1 -Prefix $prefix *>&1 |
                Tee-Object -FilePath "$env:RUNNER_TEMP\report-$PrikkVersion.log" | Out-Null
            } finally { $env:Path = $saved }
            Get-Content "$env:RUNNER_TEMP\report-$PrikkVersion.log" -Raw
          }

          # **Too old: one of the three rows that must not say "still runs".**
          $old = Invoke-WithFakePrikk $env:PRIKK_BELOW
          Write-Host $old
          if ($old -notmatch [regex]::Escape("that is too old for this stikk, which needs prikk 0.$env:PRIKK_FLOOR or newer.")) {
            Write-Error 'the too-old wording is missing'; exit 1
          }
          if ($old -notmatch [regex]::Escape('irm https://github.com/prikk-vcs/prikk/releases/latest/download/install.ps1 | iex')) {
            Write-Error "the too-old row did not print prikk's install command"; exit 1
          }
          if ($old -notmatch '1\. install or update prikk \(the command is above\)') { Write-Error 'the Next step should say install or update'; exit 1 }
          if ($old -match 'still runs') { Write-Error 'it told someone an out-of-range prikk still runs'; exit 1 }

          # **Another major is not "too old"** (review v1 C3): the answer is a newer stikk.
          $major = Invoke-WithFakePrikk '1.0.0'
          Write-Host $major
          if ($major -notmatch [regex]::Escape('this stikk was built for prikk 0.x and does not know prikk 1.x')) {
            Write-Error 'the other-major wording is missing'; exit 1
          }
          if ($major -notmatch [regex]::Escape('https://github.com/prikk-vcs/stikk/releases/latest')) {
            Write-Error "it did not point at stikk's releases"; exit 1
          }
          if ($major -notmatch '1\. check for a newer stikk') { Write-Error 'the Next step should send them to check'; exit 1 }
          if ($major -match 'too old') { Write-Error 'a newer major was called too old'; exit 1 }
          # **Never prikk's own install route here**, the same negative the Unix leg asserts: it
          # would leave the reader on the prikk they already have.
          if ($major -match [regex]::Escape('https://github.com/prikk-vcs/prikk/releases/latest/download/install.ps1')) {
            Write-Error "it offered a prikk-1.x user prikk's installer"; exit 1
          }
          if ($major -match [regex]::Escape('https://prikk.org/docs/guide/install.html')) {
            Write-Error 'it sent a prikk-1.x user to prikk'; exit 1
          }

          # **A version stikk cannot read**: measured, stikk refuses to start (review v1 C2).
          $unreadable = Invoke-WithFakePrikk 'version unknown'
          Write-Host $unreadable
          if ($unreadable -notmatch 'will refuse to start with this prikk') {
            Write-Error 'it did not say stikk will refuse to start'; exit 1
          }
          if ($unreadable -notmatch '1\. install or update prikk \(the command is above\)') { Write-Error 'the Next step is missing'; exit 1 }
          if ($unreadable -match 'still runs') { Write-Error 'it promised an unreadable prikk still runs'; exit 1 }

          # **Inside the range.** A full `0.<n>.0` on PATH (the script parses three numbers),
          # asserted against the **minor** the scripts print. See the Unix leg's note.
          $inside = Invoke-WithFakePrikk $env:PRIKK_INRANGE
          Write-Host $inside
          if ($inside -notmatch [regex]::Escape("that is inside the range this stikk was tested against (0.$env:PRIKK_FLOOR through $env:PRIKK_VER)")) {
            Write-Error 'the inside-range wording is missing'; exit 1
          }

          # **Newer than tested: calm, and it still runs.**
          $newer = Invoke-WithFakePrikk $env:PRIKK_ABOVE
          Write-Host $newer
          if ($newer -notmatch [regex]::Escape("that is newer than this stikk was tested against (0.$env:PRIKK_FLOOR through $env:PRIKK_VER).")) {
            Write-Error 'the newer-than-tested wording is missing'; exit 1
          }
          if ($newer -notmatch 'It still runs') { Write-Error 'it did not say it still runs'; exit 1 }

      - name: The removed parameters fail loudly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # A stale copy-pasted command must not appear to work. PowerShell rejects an unknown
          # parameter itself, before the script's own code runs.
          foreach ($flag in @('-WithPrikk', '-NoPrikk')) {
            & (Get-Process -Id $PID).Path -NoProfile -Command `
              "& ./filled/install.ps1 -Prefix '$env:RUNNER_TEMP\flagged' $flag" 2>&1 |
              Tee-Object -FilePath "$env:RUNNER_TEMP\flag.log"
            if ($LASTEXITCODE -eq 0) { Write-Error "$flag was accepted"; exit 1 }
            Write-Host "$flag refused with exit $LASTEXITCODE, as it should"
            if (Test-Path "$env:RUNNER_TEMP\flagged\stikk.exe") { Write-Error 'it installed anyway'; exit 1 }
          }
          exit 0

      # RFC 048 decision 3: `irm ... | iex` runs in the user's own session, so the installer puts
      # the folder on that session's PATH and `stikk` works in the same window. **Run the way the
      # README gives it** -- `iex` of the script's content, never as a downloaded file, which is
      # what the install page also refuses to tell anyone to do.
      - name: stikk resolves in the same session that installed it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = Get-Command stikk -ErrorAction SilentlyContinue
          if ($before) { Write-Error 'stikk already resolves; this leg would prove nothing'; exit 1 }
          & ([scriptblock]::Create((Get-Content ./filled/install.ps1 -Raw)))
          # **No new session, no reloaded PATH**: the same `pwsh` that ran the installer.
          $cmd = Get-Command stikk -ErrorAction SilentlyContinue
          if (-not $cmd) { Write-Error 'stikk does not resolve in the session that installed it'; exit 1 }
          $v = & stikk --version
          if ($v.Trim() -ne "stikk $env:STIKK_VER") { Write-Error "got '$v'"; exit 1 }
          Write-Host "stikk resolves at $($cmd.Source) in the installing session"

  # **RFC 048 F4, corrected, and now a requirement rather than a question.**
  #
  # The `aarch64-unknown-linux-gnu` archive requires `GLIBC_2.39` and its version-requirement
  # entry is **not** flagged optional, so it does not start on Debian 12, Raspberry Pi OS
  # bookworm or Ubuntu 22.04. Handoff A's job measured that on this very runner, and this job
  # now proves the fix: the installer takes a **static musl** build, and that build runs here.
  #
  # **It builds what it installs.** The published 0.14.0 has no aarch64 musl archive, so until
  # 0.15.0 is out there is nothing to download -- and building it at the commit under test is
  # better anyway: the installer and the build are then tested together on glibc 2.35 at every
  # commit, not only at release. The archive is packaged exactly as `release.yml` packages it.
  linux-aarch64:
    name: install.sh (ubuntu-22.04-arm, glibc 2.35)
    needs: derive
    runs-on: ubuntu-22.04-arm
    env:
      STIKK_VER: ${{ needs.derive.outputs.stikk }}
      PRIKK_VER: ${{ needs.derive.outputs.prikk }}
      PRIKK_FLOOR: ${{ needs.derive.outputs.floor }}
      TARGET: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: What glibc is this
        run: |
          set -euo pipefail
          uname -m
          ldd --version | head -1

      - name: Fill the placeholders the way release.yml does
        run: |
          set -euo pipefail
          mkdir -p filled
          sed -e "s/@STIKK_VERSION@/${STIKK_VER}/g" \
              -e "s/@PRIKK_FLOOR@/${PRIKK_FLOOR}/g" \
              -e "s/@PRIKK_VERSION@/${PRIKK_VER}/g" \
            scripts/install.sh > filled/install.sh
          chmod +x filled/install.sh
          ! grep -q '@STIKK_VERSION@\|@PRIKK_FLOOR@\|@PRIKK_VERSION@' filled/install.sh \
            || { echo "::error::placeholder survived"; exit 1; }

      - name: Build and package the archive exactly as release.yml does
        run: |
          set -euo pipefail
          cargo build --release --locked -p stikk --target "$TARGET"
          # **Two versions here, and they are not the same one** (review v1 C1).
          #
          # `STIKK_VER` is the latest *published* release, which is the name `install.sh` will
          # ask the mirror for -- so the archive must carry it. But the binary inside was built
          # from this commit, and from release prep onward that is the *next* version: the prep
          # commit sets the workspace to 0.15.0 while 0.14.0 is still the latest release. So the
          # version this leg asserts is read from the workspace, not from `STIKK_VER`; asserting
          # `STIKK_VER` would redden this job on the very commit we would be asked to tag.
          built="$(cargo metadata --no-deps --format-version 1 \
                    | jq -r '.packages[] | select(.name=="stikk") | .version')"
          echo "BUILT_VER=${built}" >> "$GITHUB_ENV"
          echo "archive named for the published ${STIKK_VER}; the binary in it is ${built}"
          # **The same four lines `release.yml`'s "Package (unix)" step runs**, with the
          # published version's name so the installer asks for this file and not another.
          dist="stikk-${STIKK_VER}-${TARGET}"
          mkdir "$dist"
          cp "target/${TARGET}/release/stikk" "$dist/"
          cp README.md LICENSE CHANGELOG.md "$dist/"
          tar -czf "${dist}.tar.gz" "$dist"
          sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          mirror="$RUNNER_TEMP/mirror"; mkdir -p "$mirror"
          mv "${dist}.tar.gz" "${dist}.tar.gz.sha256" "$mirror/"
          ls -l "$mirror"

      - name: It is static — no interpreter, no shared library, no glibc requirement
        run: |
          set -euo pipefail
          exe="target/${TARGET}/release/stikk"
          file "$exe"
          # **The three things that made the gnu build fail here**, each asserted rather than
          # described: a loader to find, a library to resolve, and a glibc version to satisfy.
          ! readelf -l "$exe" | grep -q INTERP   || { echo "::error::it needs a dynamic loader"; exit 1; }
          ! readelf -d "$exe" | grep -q NEEDED   || { echo "::error::it needs a shared library"; exit 1; }
          ! readelf -V "$exe" | grep -q 'Version needs' \
            || { echo "::error::it carries a glibc version requirement"; exit 1; }

      - name: Install it and run it on glibc 2.35
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          sh filled/install.sh --prefix "$RUNNER_TEMP/bin" \
            --base-url "file://$RUNNER_TEMP/mirror" | tee "$RUNNER_TEMP/install.log"
          # **The installer must choose musl here.** If it ever goes back to the gnu build, the
          # mirror will not hold what it asks for and this fails on the fetch -- so the target is
          # asserted by name too, and the failure says which.
          grep -q "$TARGET" "$RUNNER_TEMP/install.log" \
            || { echo "::error::install.sh did not take $TARGET"; exit 1; }
          # **stderr empty is the assertion now**, not a notice: Handoff A asked whether the
          # loader says anything here, and the answer is that it must not.
          "$RUNNER_TEMP/bin/stikk" --version > "$RUNNER_TEMP/out.txt" 2> "$RUNNER_TEMP/err.txt"
          echo "== stdout"; cat "$RUNNER_TEMP/out.txt"
          echo "== stderr"; cat "$RUNNER_TEMP/err.txt"
          test ! -s "$RUNNER_TEMP/err.txt" \
            || { echo "::error::stikk printed to stderr on glibc $(ldd --version | head -1 | awk '{print $NF}')"; exit 1; }
          # **The version the build carries**, not the published one the archive is named for
          # (review v1 C1); they diverge from release prep onward.
          grep -qx "stikk ${BUILT_VER}" "$RUNNER_TEMP/out.txt"
