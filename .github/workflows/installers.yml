name: Installers

# RFC 039 decision 3: the installer scripts are tested by installing a real release with the
# scripts from the commit under test, on all three platforms. Until the first release that carries
# them, that is the **latest published** release; from then on it is the one they ship with.
#
# Not on every push: these legs download from GitHub releases, and an upstream hiccup must not
# redden a PR for a reason stikk did not cause. They run when the scripts themselves change.
on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/installers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    name: derive the versions under test
    runs-on: ubuntu-latest
    outputs:
      stikk: ${{ steps.v.outputs.stikk }}
      prikk: ${{ steps.v.outputs.prikk }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: The latest published stikk, and the prikk version.rs validates
        id: v
        # Both derived, never written here: the prikk pin comes from `version.rs` the way the
        # real-binary suite's matrix does, so raising the ceiling re-pins the installers too.
        run: |
          set -euo pipefail
          stikk="$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)"
          read -r _floor ceiling < <(cargo run --quiet -p stikk-prikk --example print_version_matrix)
          echo "stikk=${stikk}"      >> "$GITHUB_OUTPUT"
          echo "prikk=0.${ceiling}.0" >> "$GITHUB_OUTPUT"
          echo "testing the installers against stikk ${stikk}, prikk pinned to 0.${ceiling}.0"
        env:
          GH_TOKEN: ${{ github.token }}

  unix:
    name: install.sh (${{ matrix.os }})
    needs: derive
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      STIKK_VER: ${{ needs.derive.outputs.stikk }}
      PRIKK_VER: ${{ needs.derive.outputs.prikk }}
    steps:
      - uses: actions/checkout@v5

      - name: Fill the placeholders the way release.yml does
        run: |
          set -euo pipefail
          mkdir -p filled
          for f in install.sh uninstall.sh; do
            sed -e "s/@STIKK_VERSION@/${STIKK_VER}/g" -e "s/@PRIKK_VERSION@/${PRIKK_VER}/g" \
              "scripts/$f" > "filled/$f"
            chmod +x "filled/$f"
          done
          ! grep -q '@STIKK_VERSION@\|@PRIKK_VERSION@' filled/* || { echo "::error::placeholder survived"; exit 1; }

      - name: The unfilled template refuses to run
        run: |
          set -euo pipefail
          if sh scripts/install.sh --prefix "$RUNNER_TEMP/never" --no-prikk; then
            echo "::error::the template installed something; it must refuse"
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/never/stikk"

      - name: Install, and check the version
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          printf '# test shell config\n' > "$HOME/.zshrc"
          cp "$HOME/.zshrc" "$RUNNER_TEMP/zshrc.before"
          sh filled/install.sh --prefix "$RUNNER_TEMP/bin" --no-prikk | tee "$RUNNER_TEMP/install.log"
          "$RUNNER_TEMP/bin/stikk" --version
          "$RUNNER_TEMP/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"
          # On x86_64 Linux it must take the **static musl** build, not the glibc one: the glibc
          # build cannot start on Alpine or against an older glibc (review v1 §2.2).
          if [ "$RUNNER_OS" = Linux ] && [ "$(uname -m)" = x86_64 ]; then
            grep -q 'x86_64-unknown-linux-musl' "$RUNNER_TEMP/install.log"
            file "$RUNNER_TEMP/bin/stikk" | grep -q 'static-pie'
          fi

      - name: Re-running is safe
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          sh filled/install.sh --prefix "$RUNNER_TEMP/bin" --no-prikk
          "$RUNNER_TEMP/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"

      - name: The uninstaller leaves things as it found them
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          sh filled/uninstall.sh --prefix "$RUNNER_TEMP/bin"
          test ! -e "$RUNNER_TEMP/bin/stikk"
          # Byte-identical, including the blank line the installer writes before its PATH block.
          diff "$HOME/.zshrc" "$RUNNER_TEMP/zshrc.before"

      - name: A wrong checksum installs nothing
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mirror="$RUNNER_TEMP/mirror"; mkdir -p "$mirror"
          # **The same target `install.sh` picks**, or the mirror will not hold the file it asks
          # for and this step fails on a fetch error instead of a checksum mismatch -- which is
          # what happened the first time the assertion below was in place, because Linux x86_64
          # moved to the musl build.
          case "$RUNNER_OS/$(uname -m)" in
            Linux/x86_64)          target=x86_64-unknown-linux-musl ;;
            Linux/aarch64|Linux/arm64) target=aarch64-unknown-linux-gnu ;;
            macOS/arm64)           target=aarch64-apple-darwin ;;
            macOS/x86_64)          target=x86_64-apple-darwin ;;
            *) echo "::error::unhandled runner $RUNNER_OS/$(uname -m)"; exit 1 ;;
          esac
          echo "mirroring $target, the build install.sh picks here"
          archive="stikk-${STIKK_VER}-${target}.tar.gz"
          base="https://github.com/${{ github.repository }}/releases/download/${STIKK_VER}"
          curl -fsSL -o "$mirror/$archive"        "$base/$archive"
          curl -fsSL -o "$mirror/$archive.sha256" "$base/$archive.sha256"
          # The real checksum, a tampered archive.
          printf 'this is not the real archive' > "$mirror/$archive"
          if sh filled/install.sh --prefix "$RUNNER_TEMP/tampered" --no-prikk \
               --base-url "file://$mirror" > "$RUNNER_TEMP/tamper.log" 2>&1; then
            echo "::error::the installer accepted a file that failed its checksum"
            exit 1
          fi
          cat "$RUNNER_TEMP/tamper.log"
          # **Why it failed, not just that it did.** A fetch error would also exit non-zero and
          # would leave this test green while testing nothing.
          grep -q 'does NOT match the published checksum' "$RUNNER_TEMP/tamper.log"
          test ! -e "$RUNNER_TEMP/tampered/stikk"

      - name: --with-prikk installs the pinned prikk through prikk's own installer
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home2"; mkdir -p "$HOME"
          sh filled/install.sh --prefix "$RUNNER_TEMP/both" --with-prikk
          "$RUNNER_TEMP/both/prikk" --version | grep -qx "prikk ${PRIKK_VER}"
          "$RUNNER_TEMP/both/stikk" --version | grep -qx "stikk ${STIKK_VER}"

      # The command the README actually gives: the script arrives on a pipe while the person is at
      # a terminal. `[ -t 0 ]` is false there, which is why the question is asked through
      # /dev/tty -- and why this leg drives a real pty rather than a pipe (review v1 §2.1).
      - name: curl | sh at a terminal asks about prikk, and takes both answers
        run: |
          set -euo pipefail
          for answer in y n; do
            home="$RUNNER_TEMP/tty-$answer"; mkdir -p "$home"
            out="$RUNNER_TEMP/tty-$answer.log"
            python3 - "$answer" filled/install.sh "$home/.local/bin" "$home" > "$out" <<'PYEOF'
          import os, pty, select, subprocess, sys, fcntl, termios, time
          answer, script, prefix, home = sys.argv[1:5]
          master, slave = pty.openpty()
          def setup():
              os.setsid(); fcntl.ioctl(slave, termios.TIOCSCTTY, 0)
          proc = subprocess.Popen(["sh", "-s", "--", "--prefix", prefix],
              stdin=subprocess.PIPE, stdout=slave, stderr=slave, preexec_fn=setup, close_fds=True,
              env={**os.environ, "HOME": home, "PATH": prefix + ":/usr/bin:/bin"})
          os.close(slave)
          proc.stdin.write(open(script, "rb").read()); proc.stdin.close()
          out, asked, deadline = b"", False, time.time() + 300
          while time.time() < deadline:
              r, _, _ = select.select([master], [], [], 0.5)
              if r:
                  try: chunk = os.read(master, 4096)
                  except OSError: break
                  if not chunk: break
                  out += chunk
                  if not asked and b"[Y/n]" in out:
                      os.write(master, answer.encode() + b"\n"); asked = True
              elif proc.poll() is not None: break
          proc.wait(timeout=60)
          sys.stdout.write(out.decode(errors="replace").replace("\r\n", "\n"))
          sys.exit(0 if (asked and proc.returncode == 0) else 1)
          PYEOF
            cat "$out"
            grep -q 'install prikk .* \[Y/n\]' "$out" || { echo "::error::it never asked ($answer)"; exit 1; }
            "$home/.local/bin/stikk" --version | grep -qx "stikk ${STIKK_VER}"
            if [ "$answer" = y ]; then
              "$home/.local/bin/prikk" --version | grep -qx "prikk ${PRIKK_VER}"
            else
              test ! -e "$home/.local/bin/prikk"
            fi
          done

      # `setsid` is Linux-only -- macOS has no such command (its first run failed here). A new
      # session is started from Python instead, which is portable and leaves the child with no
      # controlling terminal on either platform.
      - name: With no controlling terminal it does not block
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/notty"; mkdir -p "$home"
          python3 - "$home" > "$RUNNER_TEMP/notty.log" 2>&1 <<'PYEOF'
          import os, subprocess, sys
          home = sys.argv[1]
          prefix = os.path.join(home, ".local", "bin")
          proc = subprocess.run(
              ["sh", "-s", "--", "--prefix", prefix],
              stdin=open("filled/install.sh", "rb"),
              stdout=sys.stdout, stderr=subprocess.STDOUT,
              preexec_fn=os.setsid,          # no controlling terminal, on Linux and macOS alike
              env={**os.environ, "HOME": home, "PATH": prefix + ":/usr/bin:/bin"},
          )
          sys.exit(proc.returncode)
          PYEOF
          cat "$RUNNER_TEMP/notty.log"
          grep -q 'no terminal to ask on' "$RUNNER_TEMP/notty.log"
          test ! -e "$home/.local/bin/prikk"

  windows:
    name: install.ps1 (windows-latest)
    needs: derive
    runs-on: windows-latest
    env:
      STIKK_VER: ${{ needs.derive.outputs.stikk }}
      PRIKK_VER: ${{ needs.derive.outputs.prikk }}
    steps:
      - uses: actions/checkout@v5

      - name: Fill the placeholders the way release.yml does
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p filled
          for f in install.ps1 uninstall.ps1; do
            sed -e "s/@STIKK_VERSION@/${STIKK_VER}/g" -e "s/@PRIKK_VERSION@/${PRIKK_VER}/g" \
              "scripts/$f" > "filled/$f"
          done
          ! grep -q '@STIKK_VERSION@\|@PRIKK_VERSION@' filled/* || { echo "::error::placeholder survived"; exit 1; }

      # Run it as its own process: the script refuses by calling `exit 1`, and invoked inline that
      # ends the step itself before anything can be checked (its first run failed exactly so,
      # having printed the correct refusal first).
      - name: The unfilled template refuses to run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & (Get-Process -Id $PID).Path -NoProfile -File ./scripts/install.ps1 -Prefix "$env:RUNNER_TEMP\never" -NoPrikk
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error 'the template installed something; it must refuse'; exit 1 }
          Write-Host "refused with exit $code, as it should"
          if (Test-Path "$env:RUNNER_TEMP\never\stikk.exe") { Write-Error 'it installed anyway'; exit 1 }
          # GitHub's pwsh shell ends every step with `exit $LASTEXITCODE`, which is still the
          # child's 1 -- so a step that *expects* a failure has to say it succeeded.
          exit 0

      - name: Install, and check the version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./filled/install.ps1 -Prefix "$env:RUNNER_TEMP\bin" -NoPrikk
          $v = & "$env:RUNNER_TEMP\bin\stikk.exe" --version
          if ($v.Trim() -ne "stikk $env:STIKK_VER") { Write-Error "got '$v'"; exit 1 }

      - name: Re-running is safe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./filled/install.ps1 -Prefix "$env:RUNNER_TEMP\bin" -NoPrikk
          $v = & "$env:RUNNER_TEMP\bin\stikk.exe" --version
          if ($v.Trim() -ne "stikk $env:STIKK_VER") { Write-Error "got '$v'"; exit 1 }

      - name: The uninstaller removes what it added
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./filled/uninstall.ps1 -Prefix "$env:RUNNER_TEMP\bin"
          if (Test-Path "$env:RUNNER_TEMP\bin\stikk.exe") { Write-Error 'stikk.exe survived'; exit 1 }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and ($userPath -split ';' | Where-Object { $_ -and ($_.TrimEnd('\') -ieq "$env:RUNNER_TEMP\bin") })) {
            Write-Error 'the PATH entry survived'; exit 1
          }

      - name: A wrong checksum installs nothing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $mirror = "$env:RUNNER_TEMP\mirror"
          New-Item -ItemType Directory -Path $mirror -Force | Out-Null
          $archive = "stikk-$env:STIKK_VER-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:STIKK_VER"
          Invoke-WebRequest -Uri "$base/$archive"        -OutFile "$mirror\$archive"        -UseBasicParsing
          Invoke-WebRequest -Uri "$base/$archive.sha256" -OutFile "$mirror\$archive.sha256" -UseBasicParsing
          # The real checksum, a tampered archive.
          Set-Content -Path "$mirror\$archive" -Value 'this is not the real archive' -NoNewline
          $uri = ([System.Uri]("file:///" + $mirror.Replace('\','/'))).AbsoluteUri
          # Its own process, for the same reason the template check uses one: the script refuses
          # with `exit 1`, and inline that would end this step before anything is asserted.
          & (Get-Process -Id $PID).Path -NoProfile -File ./filled/install.ps1 -Prefix "$env:RUNNER_TEMP\tampered" -NoPrikk -BaseUrl $uri 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\tamper.log"
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error 'the installer accepted a file that failed its checksum'; exit 1 }
          Write-Host "refused with exit $code, as it should"
          # **Why it failed, not just that it did**: a malformed mirror URI would also exit
          # non-zero and leave this test green while testing nothing.
          if (-not (Select-String -Path "$env:RUNNER_TEMP\tamper.log" -SimpleMatch 'does NOT match the published checksum' -Quiet)) {
            Write-Error 'it failed, but not because of the checksum'; exit 1
          }
          if (Test-Path "$env:RUNNER_TEMP\tampered\stikk.exe") { Write-Error 'it installed anyway'; exit 1 }
          exit 0
