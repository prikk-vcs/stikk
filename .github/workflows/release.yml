name: Release

# Cut a release from a version tag. Tags follow the Rust convention — the bare Cargo version, no `v`
# prefix (e.g. `0.1.0`, `0.2.0-rc.1`). The flow is, in order:
#   guard   → the tag must equal the workspace version; classify pre-release
#   verify  → the full CI gate (fmt · clippy -D warnings · test) on the tagged commit
#   release → create the GitHub Release with notes from CHANGELOG.md
#   crates  → publish every crate to crates.io via Trusted Publishing (idempotent), behind an
#             approval environment; short-lived OIDC token, no stored secret
#   binaries→ build, checksum, and provenance-attest the `stikk` binary for each target
#
# Nothing publishes until a maintainer pushes a version tag; crates.io publishing additionally waits on
# the `release` environment (add required reviewers there for a manual gate). See docs/src/contributing/
# releasing.md for the one-time Trusted Publishing setup and the first manual publish.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Guard the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag must equal the workspace version
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ws="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="stikk") | .version')"
          echo "tag=$tag  workspace=$ws"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag ($tag) does not match the workspace version in Cargo.toml ($ws)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Gate (fmt · clippy · test)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the MSRV from Cargo.toml, never restate it
        # RFC 020 §4/F1: this pin read 1.85 after the workspace MSRV moved to 1.88, which would have
        # failed a release at tag time — after the tag was pushed, mid-publish, version already spent.
        id: msrv
        run: echo "v=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (derived MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  release:
    name: Create the GitHub Release
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract the CHANGELOG section
        run: |
          set -euo pipefail
          ver="${{ needs.guard.outputs.version }}"
          # Pull the body under `## [ver]` or `## ver` (any trailing date) up to the next `## `.
          awk -v ver="$ver" '
            $0 ~ ("^## \\[?" ver "\\]?([^0-9].*)?$") { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            printf 'Release %s.\n' "$ver" > RELEASE_NOTES.md
          fi
      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: stikk ${{ needs.guard.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.guard.outputs.prerelease }}
          generate_release_notes: true

  crates:
    name: Publish to crates.io
    needs: [guard, verify]
    runs-on: ubuntu-latest
    # An approval gate for the irreversible publish: add required reviewers to this environment in the
    # repo settings to require a manual click before any crate is pushed.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Plan — which crates are not yet on crates.io
        id: plan
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          missing=""
          for crate in stikk-model stikk-prikk stikk-state stikk-core stikk-tui stikk; do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: stikk-release (github actions; https://github.com/prikk-vcs/stikk)' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            [ "$code" = "200" ] || missing="${missing} ${crate}"
          done
          missing="$(echo ${missing} | xargs || true)"
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"
          [ -n "${missing}" ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"
          echo "to publish: '${missing:-<none — all already on crates.io>}'"
      # The remaining steps run only when something is actually new — so a re-tag (or a tag whose
      # crates were first published by hand) needs no Trusted Publishing at all.
      - name: Install Rust
        if: steps.plan.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.any == 'true'
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: steps.plan.outputs.any == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the missing crates (dependency order)
        if: steps.plan.outputs.any == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          MISSING: ${{ steps.plan.outputs.missing }}
        run: |
          set -euo pipefail
          # Canonical dependency order (model → prikk/state → core → tui → launcher), restricted to
          # the crates that are actually missing.
          for crate in stikk-model stikk-prikk stikk-state stikk-core stikk-tui stikk; do
            case " ${MISSING} " in
              *" ${crate} "*) echo "== publishing ${crate}"; cargo publish -p "${crate}" --locked ;;
              *) echo "== ${crate} already on crates.io — skipping" ;;
            esac
          done

  binaries:
    name: Binary (${{ matrix.target }})
    needs: [guard, release]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # **The static build 64-bit ARM Linux actually needs** (RFC 048 F4, corrected). The gnu
          # archive above carries the glibc of the runner it was built on, and on aarch64 its
          # `GLIBC_2.39` version requirement is *not* flagged optional -- so it does not start on
          # Debian 12, Raspberry Pi OS bookworm or Ubuntu 22.04, measured on real hardware. The
          # gnu archive stays published; the installer takes this one, as it already does on
          # x86_64 for the same reason.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Both macOS slices build on an Apple-Silicon runner: aarch64 natively, and x86_64 by
          # cross-compiling (the macOS toolchain ships both arches). The Intel `macos-13` runners are
          # retired, so a native x86_64 job would queue forever.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        # **Both musl targets**, matched by suffix rather than listed: a third one added to the
        # matrix above would otherwise build against the wrong linker and nothing here would say
        # so. (RFC 048 Handoff B.)
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the launcher
        run: cargo build --release --locked -p stikk --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dist="stikk-${VERSION}-${TARGET}"
          mkdir "$dist"
          cp "target/${TARGET}/release/stikk" "$dist/"
          cp README.md LICENSE CHANGELOG.md "$dist/"
          tar -czf "${dist}.tar.gz" "$dist"
          if command -v sha256sum >/dev/null; then
            sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          else
            shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          fi
          echo "ASSET=${dist}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=${dist}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "stikk-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "target/$env:TARGET/release/stikk.exe" $dist/
          Copy-Item README.md, LICENSE, CHANGELOG.md $dist/
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          # The same shape the five Unix targets publish: "<lowercase hash><two spaces><file name>",
          # LF-terminated. It used to be the bare uppercase hash with a CRLF and no file name, which
          # meant `sha256sum -c` could not be used on Windows and every consumer needed two parsers
          # (RFC 039 Handoff A's review found it).
          $hash = (Get-FileHash "$dist.zip" -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $dist.zip`n"
          [System.IO.File]::WriteAllText("$dist.zip.sha256", $line, (New-Object System.Text.UTF8Encoding $false))
          "ASSET=$dist.zip"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "ASSET_SHA=$dist.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # v3 moved to node24 (and requires runner >= v2.327.1, far below what GitHub-hosted runners
      # run); v4 made this action a thin wrapper over `actions/attest`. `subject-path` and the
      # three permissions this job already grants are unchanged, and so is the attestation itself:
      # SLSA build provenance, verified the same way.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SHA }}

  # The one-command installers (RFC 039 decision 2 and 3). They are versioned with the release they
  # install: `scripts/*` in the repository are templates with two placeholders, filled here, so
  # `…/releases/latest/download/install.sh` always means "the latest stikk, with the prikk it was
  # validated against".
  installers:
    name: Installers
    needs: [guard, binaries]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (derived MSRV)
        uses: dtolnay/rust-toolchain@stable
      - name: Read the validated prikk range from stikk-prikk::version, never hardcode it here
        id: prikk
        # The same derivation the real-binary suite uses (RFC 019 §6): the numbers live in
        # `version.rs` and nowhere else, so changing the range there re-words the installers
        # automatically. **Both ends, since RFC 048**: the floor used to be written `28` in two
        # scripts, which is a number in three places and a quiet lie the day it moves.
        # **Neither is a pin**: the installers install no prikk, and use these only for wording.
        #
        # **The ceiling is a minor, and is printed as one** (RFC 052 decision 4). This used to
        # fill `0.<n>.0`, a patch version stikk never tested -- `VALIDATED_MAX_MINOR` bands on
        # minors, so the report can only honestly say *through 0.54*. `validated_ceiling_display`
        # inside stikk has always said the minor; this makes the installers agree with it.
        run: |
          set -euo pipefail
          read -r floor ceiling < <(cargo run --quiet -p stikk-prikk --example print_version_matrix)
          echo "floor=${floor}"       >> "$GITHUB_OUTPUT"
          echo "version=0.${ceiling}" >> "$GITHUB_OUTPUT"
      - name: Fill the placeholders and checksum each script
        env:
          PRIKK_FLOOR: ${{ steps.prikk.outputs.floor }}
          PRIKK_VERSION: ${{ steps.prikk.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in install.sh uninstall.sh install.ps1 uninstall.ps1; do
            sed -e "s/@STIKK_VERSION@/${VERSION}/g" \
                -e "s/@PRIKK_FLOOR@/${PRIKK_FLOOR}/g" \
                -e "s/@PRIKK_VERSION@/${PRIKK_VERSION}/g" \
                "scripts/$f" > "dist/$f"
            # No placeholder may survive into a published script.
            if grep -q '@STIKK_VERSION@\|@PRIKK_FLOOR@\|@PRIKK_VERSION@' "dist/$f"; then
              echo "::error::$f still holds a placeholder after substitution"
              exit 1
            fi
            # The same checksum shape every other asset uses.
            ( cd dist && sha256sum "$f" > "$f.sha256" )
          done
          echo "== filled for stikk ${VERSION}, prikk 0.${PRIKK_FLOOR} through ${PRIKK_VERSION}"
          grep -h 'STIKK_VERSION=\|PRIKK_FLOOR_MINOR=\|PRIKK_TESTED_CEILING=\|StikkVersion \|PrikkFloorMinor \|PrikkTestedCeiling ' dist/* || true
      - name: Upload the installers to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/uninstall.sh
            dist/uninstall.sh.sha256
            dist/install.ps1
            dist/install.ps1.sha256
            dist/uninstall.ps1
            dist/uninstall.ps1.sha256
