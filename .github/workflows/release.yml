name: Release

# Cut a release from a version tag. Tags follow the Rust convention — the bare Cargo version, no `v`
# prefix (e.g. `0.1.0`, `0.2.0-rc.1`). The flow is, in order:
#   guard   → the tag must equal the workspace version; classify pre-release
#   verify  → the full CI gate (fmt · clippy -D warnings · test) on the tagged commit
#   release → create the GitHub Release with notes from CHANGELOG.md
#   crates  → publish every crate to crates.io via Trusted Publishing (idempotent), behind an
#             approval environment; short-lived OIDC token, no stored secret
#   build   → `build-release.yml` with `publish: true`: the per-target binaries, checksummed and
#             provenance-attested, and the four filled installers, all uploaded to the release
#             (RFC 066 decision 1 -- `release-trial.yml` calls the same file with `publish: false`)
#
# Nothing publishes until a maintainer pushes a version tag; crates.io publishing additionally waits on
# the `release` environment (add required reviewers there for a manual gate). See docs/src/contributing/
# releasing.md for the one-time Trusted Publishing setup and the first manual publish.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Guard the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag must equal the workspace version
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ws="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="stikk") | .version')"
          echo "tag=$tag  workspace=$ws"
          if [ "$tag" != "$ws" ]; then
            echo "::error::tag ($tag) does not match the workspace version in Cargo.toml ($ws)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Gate (fmt · clippy · test)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the MSRV from Cargo.toml, never restate it
        # RFC 020 §4/F1: this pin read 1.85 after the workspace MSRV moved to 1.88, which would have
        # failed a release at tag time — after the tag was pushed, mid-publish, version already spent.
        id: msrv
        run: echo "v=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Rust (derived MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  release:
    name: Create the GitHub Release
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extract the CHANGELOG section
        run: |
          set -euo pipefail
          ver="${{ needs.guard.outputs.version }}"
          # Pull the body under `## [ver]` or `## ver` (any trailing date) up to the next `## `.
          awk -v ver="$ver" '
            $0 ~ ("^## \\[?" ver "\\]?([^0-9].*)?$") { flag=1; next }
            flag && /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            printf 'Release %s.\n' "$ver" > RELEASE_NOTES.md
          fi
      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.guard.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.guard.outputs.prerelease }}
          generate_release_notes: true

  crates:
    name: Publish to crates.io
    needs: [guard, verify]
    runs-on: ubuntu-latest
    # An approval gate for the irreversible publish: add required reviewers to this environment in the
    # repo settings to require a manual click before any crate is pushed.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Plan — which crates are not yet on crates.io
        id: plan
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          missing=""
          for crate in stikk-model stikk-prikk stikk-state stikk-core stikk-tui stikk; do
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: stikk-release (github actions; https://github.com/prikk-vcs/stikk)' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            [ "$code" = "200" ] || missing="${missing} ${crate}"
          done
          missing="$(echo ${missing} | xargs || true)"
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"
          [ -n "${missing}" ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"
          echo "to publish: '${missing:-<none — all already on crates.io>}'"
      # The remaining steps run only when something is actually new — so a re-tag (or a tag whose
      # crates were first published by hand) needs no Trusted Publishing at all.
      - name: Install Rust
        if: steps.plan.outputs.any == 'true'
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.any == 'true'
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: steps.plan.outputs.any == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the missing crates (dependency order)
        if: steps.plan.outputs.any == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          MISSING: ${{ steps.plan.outputs.missing }}
        run: |
          set -euo pipefail
          # Canonical dependency order (model → prikk/state → core → tui → launcher), restricted to
          # the crates that are actually missing.
          for crate in stikk-model stikk-prikk stikk-state stikk-core stikk-tui stikk; do
            case " ${MISSING} " in
              *" ${crate} "*) echo "== publishing ${crate}"; cargo publish -p "${crate}" --locked ;;
              *) echo "== ${crate} already on crates.io — skipping" ;;
            esac
          done

  # **The release build, defined once** (RFC 066 decision 1). The `binaries` matrix and the
  # `installers` job used to be written out here, where only a tag ever ran them -- which is how
  # 0.21.0's release met a retired macOS image for the first time mid-publish. They live in
  # `build-release.yml` now, and `release-trial.yml` calls that same file with `publish: false` at
  # every release prep, once a week, and on any push that touches these workflows or the installer
  # templates. **The build a tag runs is the build that was tried**, because there is only one.
  #
  # **This job grants the permissions the publish path needs**, and the called workflow asks for
  # none: a reusable workflow may not request more than its caller granted, and the trial's calling
  # job grants `contents: read` alone (RFC 066 decision 5).
  build:
    name: Build and publish the artifacts
    needs: [guard, release]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      publish: true

  # stikk's two AUR packages (RFC 051 decision 4). **After the crates and the assets**, because
  # `stikk` builds the crates.io crate and `stikk-bin` downloads the release's archives — both
  # must exist before the PKGBUILDs can be checksummed against them.
  #
  # **It must not fail the release.** By the time this runs the release is public, the crates are
  # on crates.io and the binaries are attached; a push the AUR refused is a thing to fix, not a
  # reason to redden a release that already happened. `continue-on-error` reports it and leaves
  # the run green.
  #
  # **To re-run it alone** after fixing whatever it was: Actions → *AUR* → *Run workflow*, with
  # `version` set to the tag and `push` checked. That is the same path the owner uses to publish
  # the current release the day the key is first set (decision 6).
  aur:
    name: AUR
    needs: [guard, crates, build]
    permissions:
      contents: read
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      push: true
      # `continue-on-error` is not allowed on a `uses:` job, so the tolerance lives inside the
      # called workflow: the one fallible step of each of its two jobs carries it, and each job
      # ends by annotating what was tolerated so the reason is not buried.
      tolerate_failure: true
    secrets: inherit
