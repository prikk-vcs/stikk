[package]
name        = "stikk"
description = "A user-facing history browser and workbench for the prikk version control system."
readme      = "./README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
stikk-model = { workspace = true }
stikk-prikk = { workspace = true }
stikk-state = { workspace = true }
stikk-core  = { workspace = true }

[lints]
workspace = true

[workspace]
members = ["crates/*"]

[workspace.package]
version         = "0.1.0"
edition         = "2024"
rust-version    = "1.85"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/prikk-vcs/stikk"
homepage        = "https://github.com/prikk-vcs/stikk"

[workspace.dependencies]
stikk-model = { version = "0.1.0", path = "crates/stikk-model" }
stikk-prikk = { version = "0.1.0", path = "crates/stikk-prikk" }
stikk-state = { version = "0.1.0", path = "crates/stikk-state" }
stikk-core  = { version = "0.1.0", path = "crates/stikk-core" }

# Lint discipline mirrors prikk's: unsafe is forbidden (no FFI in stikk yet; the TUI/GUI toolkit
# decision is deferred to Program Design), public items must be documented, and the panic-prone
# clippy lints warn so review holds the line — stikk owns no repository authority and must never
# panic a user's terminal on fallible input.
[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"

[workspace.lints.clippy]
unwrap_used         = "warn"
expect_used         = "warn"
indexing_slicing    = "warn"
