[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version         = "0.4.1"
edition         = "2024"
# 1.88: ratatui 0.30's own MSRV is 1.86, but the 0.30 tree pulls `time` transitively (through
# ratatui-widgets' non-optional calendar), and the fix for RUSTSEC-2026-0009 (time >=0.3.47) needs
# 1.88. Raised from 1.85 with the 0.30 upgrade to keep the supply-chain gate clean.
rust-version    = "1.88"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/prikk-vcs/stikk"
homepage        = "https://github.com/prikk-vcs/stikk"

[workspace.dependencies]
stikk-model = { version = "0.4.1", path = "crates/stikk-model" }
stikk-prikk = { version = "0.4.1", path = "crates/stikk-prikk" }
stikk-state = { version = "0.4.1", path = "crates/stikk-state" }
stikk-core  = { version = "0.4.1", path = "crates/stikk-core" }
stikk-tui   = { version = "0.4.1", path = "crates/stikk-tui" }

# RFC 001 (accepted 2026-09-01): the TUI is built on ratatui over the crossterm backend. crossterm is
# used through ratatui's own re-export (`ratatui::crossterm`) so the two can never drift to
# incompatible versions. 0.30 split ratatui into a workspace (core/widgets/backends); the `ratatui`
# facade still re-exports the surface used here, and its default features keep the crossterm backend.
# Note: 0.30 pulls `time` transitively via ratatui-widgets' calendar (not made optional by the facade,
# so it can't be feature-dropped even though stikk never renders a calendar) — see `rust-version` above
# for why that sets the workspace MSRV, rather than restating the reason here too (RFC 020 §4).
ratatui = "0.30"

# Lint discipline mirrors prikk's: unsafe is forbidden (no FFI in stikk yet; the TUI/GUI toolkit
# decision is deferred to Program Design), public items must be documented, and the panic-prone
# clippy lints warn so review holds the line — stikk owns no repository authority and must never
# panic a user's terminal on fallible input.
[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"

[workspace.lints.clippy]
unwrap_used         = "warn"
expect_used         = "warn"
indexing_slicing    = "warn"
