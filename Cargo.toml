[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version         = "0.22.1"
edition         = "2024"
# 1.88: ratatui 0.30's own MSRV is 1.86, but the 0.30 tree pulls `time` transitively (through
# ratatui-widgets' non-optional calendar), and the fix for RUSTSEC-2026-0009 (time >=0.3.47) needs
# 1.88. Raised from 1.85 with the 0.30 upgrade to keep the supply-chain gate clean.
rust-version    = "1.88"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/prikk-vcs/stikk"
homepage        = "https://github.com/prikk-vcs/stikk"

[workspace.dependencies]
stikk-model = { version = "0.22.1", path = "crates/stikk-model" }
stikk-prikk = { version = "0.22.1", path = "crates/stikk-prikk" }
stikk-state = { version = "0.22.1", path = "crates/stikk-state" }
stikk-core  = { version = "0.22.1", path = "crates/stikk-core" }
stikk-app   = { version = "0.22.1", path = "crates/stikk-app" }
stikk-tui   = { version = "0.22.1", path = "crates/stikk-tui" }
# RFC 070: the desktop app's design crate. **A path and no version**, deliberately: both GUI
# crates are `publish = false`, so there is no `stikk-gui-design` on crates.io for a version
# requirement to resolve against -- and `cargo package --workspace` tries to package every member,
# publishable or not, so a version here stops the packaging gate with *"no matching package named
# stikk-gui-design found"* (measured, 2026-11-28). A path-only dependency is what an unpublished
# crate takes.
stikk-gui-design = { path = "crates/stikk-gui-design" }

# RFC 001 (accepted 2026-09-01): the TUI is built on ratatui over the crossterm backend. crossterm is
# used through ratatui's own re-export (`ratatui::crossterm`) so the two can never drift to
# incompatible versions. 0.30 split ratatui into a workspace (core/widgets/backends); the `ratatui`
# facade still re-exports the surface used here, and its default features keep the crossterm backend.
# Note: 0.30 pulls `time` transitively via ratatui-widgets' calendar (not made optional by the facade,
# so it can't be feature-dropped even though stikk never renders a calendar) — see `rust-version` above
# for why that sets the workspace MSRV, rather than restating the reason here too (RFC 020 §4).
ratatui = "0.30"

# RFC 059 (accepted 2026-11-21) decision 5: *system* asks the terminal whether its background is light
# or dark, over `OSC 11`/`DA1`. Used by `stikk-tui` only, through `theme::detect`, once at startup.
# The alternative is writing the query by hand -- raw byte reads with a timeout on Unix, and console VT
# input on Windows, which is `terminal-trx`'s whole job (F4). By crate name it adds four small crates
# over stikk's own tree (`terminal-colorsaurus`, `terminal-trx`, `xterm-color`, `memchr`), and on
# Windows `windows-sys` with its `windows-link` shim; every one is MIT or Apache-2.0 and the highest
# minimum Rust among them is 1.74, against this workspace's 1.88.
terminal-colorsaurus = "1.0.3"

# RFC 065 (done 2026-11-27) chose Snora on iced for the desktop app, and RFC 070 builds it. **Both
# are pinned exactly**, to the versions RFC 065's prototype measured: its findings about what the
# stack does and does not do by itself (the scrollbar's overlap, the disabled contrast, the default
# font, `system::theme()`) are facts about these two versions, and a floating requirement would let
# the tree move under rules that were measured against them. Both declare MSRV 1.88, this
# workspace's own (RFC 070 F3), so no raise is needed.
snora = { version = "=0.65.0", features = ["design"] }
iced  = { version = "=0.14.0", features = ["tokio"] }

# `iced_test`'s headless harness, for the H level (RFC 070 decision 7). A dev-dependency of
# `stikk-gui` only; it never enters a shipped build.
iced_test = "=0.14.0"

# Lint discipline mirrors prikk's: unsafe is forbidden (no FFI in stikk yet; the TUI/GUI toolkit
# decision is deferred to Program Design), public items must be documented, and the panic-prone
# clippy lints warn so review holds the line — stikk owns no repository authority and must never
# panic a user's terminal on fallible input.
[workspace.lints.rust]
unsafe_code     = "forbid"
missing_docs    = "warn"

[workspace.lints.clippy]
unwrap_used         = "warn"
expect_used         = "warn"
indexing_slicing    = "warn"
