[package]
name        = "stikk-tui"
description = "The terminal (TUI) frontend for stikk. Renders the operation layer's view-models; computes nothing about the repository."

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
stikk-app   = { workspace = true }
stikk-model = { workspace = true }
stikk-prikk = { workspace = true }
stikk-state = { workspace = true }
stikk-core  = { workspace = true }

ratatui     = { workspace = true }

# RFC 059 decision 5: the one terminal query, sent before the alternate screen is entered.
terminal-colorsaurus = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The program's own test constructor, for the tests that drive the program *and* the drawing
# together (RFC 067 Handoff B §2). Off in every normal build.
stikk-app = { workspace = true, features = ["test-fixtures"] }
