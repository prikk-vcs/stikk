# The supply-chain gate (RFC 020 F4). One tool, one config, one report: advisories (the reason this
# exists — RUSTSEC-2026-0009 was found by a person reading a report, not by anything in CI) and
# licenses (stikk publishes six Apache-2.0 crates; a copyleft dependency arriving transitively is a
# problem nobody here is currently positioned to notice) in the same run.
#
# Runs only in `.github/workflows/supply-chain.yml` (`workflow_dispatch`, never on push/PR — RFC 019's
# own reasoning: a gate that fails for an upstream reason overnight must not redden an unrelated PR) and
# is required, read by a human, in release prep (`.git-exclude/specs/02-implementer-handoff.md` §5c).
#
# Every `[advisories] ignore` entry below must carry a dated reason and what would let it be removed —
# an ignore list without both becomes permanent by default, indistinguishable from an unnoticed advisory.

[graph]
all-features = false
no-default-features = false

[advisories]
# **An advisory deep in the tree is still in the binary stikk ships** (RFC 068).
#
# cargo-deny's defaults report an *unsound* or *unmaintained* advisory only for a crate the
# workspace depends on directly, so a defect two or three crates down passes the gate in silence.
# Every advisory in the tree is reported here, at any depth, and anything that cannot be fixed is
# written down below with the reason it does not reach stikk -- said in the file, not by the gate
# staying quiet.
unsound = "all"
unmaintained = "all"

ignore = [
    # **RUSTSEC-2026-0253 (2026-05-12), `lru` 0.16.4: a use-after-free if `LruCache::pop()` is
    # called while a stored key's `Drop` panics.** Reached as ratatui-core 0.1.0 -> ratatui ->
    # `stikk-tui`; ratatui-core 0.1.0 requires `lru` 0.16, so there is no version of it to move to.
    #
    # **It cannot happen in stikk**, checked in ratatui-core 0.1.0's own source: the layout cache is
    # `LruCache<(Rect, Layout), (Segments, Spacers)>` (`layout/layout.rs:36`) and ratatui calls only
    # `resize` (`:303`) and `get_or_insert` (`:720`) on it -- never `pop`, in that file or anywhere
    # else in the crate. The keys cannot panic on drop either: `Rect` is four `u16`s, `Layout` is
    # plain enums and a `Vec<Constraint>`, and ratatui-core writes no `Drop` impl at all.
    #
    # **What retires this entry:** a ratatui release that depends on `lru >= 0.18.2`. The next
    # ratatui upgrade must check for one and delete this (RFC 068 decision 3).
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 through ratatui-core 0.1.0 -> ratatui -> stikk-tui. The defect needs LruCache::pop() to run while a key's Drop panics; ratatui calls only resize (layout/layout.rs:303) and get_or_insert (:720) on its layout cache and never pop, and the cache's (Rect, Layout) keys are plain data with no Drop impl in the crate, so the path is unreachable from stikk. Retire this entry when a ratatui release depends on lru >= 0.18.2 -- the next ratatui upgrade must check (RFC 068)." },
]

[licenses]
# The exact set of licenses actually in the tree today (`cargo deny list`), not a generic permissive
# preset — an addition here should mean a new license genuinely arrived, not a guess at what might.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

# **The program cannot grow a terminal dependency** (RFC 067 decision 6).
#
# `stikk-app` is the program every front end drives, and the whole point of it being its own crate
# is that nothing in it can quietly start depending on a terminal. A `wrappers` entry allows a crate
# only beneath the crates named: ratatui and the colour query only under `stikk-tui`, and crossterm
# only through ratatui's own backend, which is how stikk uses it so the two cannot drift apart.
#
# This is checked by the supply-chain workflow on every push rather than remembered.
deny = [
  { crate = "ratatui", wrappers = ["stikk-tui"] },
  { crate = "terminal-colorsaurus", wrappers = ["stikk-tui"] },
  { crate = "crossterm", wrappers = ["ratatui-crossterm"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
